name: Update project stars

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update project star counts and ordering
        run: npm run update:projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate regenerated HTML
        run: npm run validate:html

      - name: Commit and push changes
        id: push
        run: |
          if git diff --quiet -- data/projects.json index.html; then
            echo "No project ordering changes to commit."
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json index.html
          git commit -m "$(cat <<'EOF'
          chore: update project star counts and order
          EOF
          )"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # A push authenticated with GITHUB_TOKEN does not trigger deploy-pages.yml.
  deploy:
    name: Deploy updated site
    needs: update
    if: ${{ needs.update.outputs.sha != '' && github.ref_name == 'main' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
